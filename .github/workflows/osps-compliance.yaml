---
# Reusable OSPS Baseline compliance workflow.
#
# Gathers signed evidence about the calling repository (SBOM, committed
# policy files, GitHub settings, Scorecard, tests, vulnerabilities and VEX),
# packs it into one attestations.jsonl and evaluates it against an OSPS
# Baseline policy with AMPEL. Call it from a workflow triggered on push:
#
#   jobs:
#     compliance:
#       permissions:
#         id-token: write
#         contents: read
#         actions: read
#       uses: carabiner-labs/actions/.github/workflows/osps-compliance.yaml@main
#
# Set push-attestations to true to also publish the evidence and the
# evaluation results to the repository's GitHub attestations store. The
# calling job then needs attestations: write as well.
#
# The carabiner-dev/actions references below are pinned to a commit on main
# until the actions used here are part of a release.
name: OSPS Compliance

on:
  workflow_call:
    inputs:
      policy:
        description: AMPEL policy or policy set to evaluate the evidence against
        type: string
        required: false
        # TODO: Pin this once we finalize the policy group
        default: git+https://github.com/carabiner-dev/policies#sets/baseline/osps-baseline.policy.json
      branch:
        description: Branch to evaluate, defaults to the repository's default.
        type: string
        required: false
        default: ''
      slsa-source-workflow:
        description: Name of the workflow that computes the SLSA source provenance for each push. Set to an empty string to skip fetching it.
        type: string
        required: false
        default: SLSA Source
      fail-on-policy:
        description: Fail the job when the policy evaluation does not pass
        type: boolean
        required: false
        default: false
      push-attestations:
        description: Push the evidence and the evaluation results to the GitHub attestations store of the repository. The calling job must grant attestations:write.
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  attest:
    name: Attest and evaluate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # To sign the attestattions keyless
      contents: read
      actions: read   # Download the SLSA source provenance from another workflow run
    env:
      BRANCH: ${{ inputs.branch || github.event.repository.default_branch }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # ------------------------------------------------------------------
      # Software bill of materials
      # ------------------------------------------------------------------
      - name: Generate SBOMs
        uses: carabiner-dev/actions/sbom/source@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          format: spdx
          files: 'true'
          sign: 'true'
          networking: full
          output-path: attestations/

      # ------------------------------------------------------------------
      # Policy documents committed to the repository, attested to the commit
      # ------------------------------------------------------------------
      - name: Attest Security Insights
        if: hashFiles('SECURITY-INSIGHTS.yml') != ''
        uses: carabiner-dev/actions/bnd/commit@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          path: SECURITY-INSIGHTS.yml
          type: https://github.com/ossf/security-insights-spec
          output: attestations/si.bundle.json

      - name: Attest OpenEoX
        if: hashFiles('.openeox.json') != ''
        uses: carabiner-dev/actions/bnd/commit@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          path: .openeox.json
          type: https://docs.oasis-open.org/openeox/core/v1.0
          output: attestations/openeox.bundle.json

      # ------------------------------------------------------------------
      # GitHub settings, snapshotted from the API
      # ------------------------------------------------------------------
      - name: Attest organization settings
        if: github.event.organization.login != ''
        uses: carabiner-dev/actions/snappy/snap@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          spec: builtin:github/org.yaml
          vars: ORG=${{ github.event.organization.login }}
          output: attestations/org.bundle.json

      - name: Attest branch rules
        uses: carabiner-dev/actions/snappy/snap@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          spec: builtin:github/branch-rules.yaml
          vars: |
            ORG=${{ github.repository_owner }}
            REPO=${{ github.event.repository.name }}
            BRANCH=${{ env.BRANCH }}
          output: attestations/branch.bundle.json

      - name: Attest repository settings
        uses: carabiner-dev/actions/snappy/snap@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          spec: builtin:github/repo.yaml
          vars: |
            ORG=${{ github.repository_owner }}
            REPO=${{ github.event.repository.name }}
          output: attestations/repo.bundle.json

      # ------------------------------------------------------------------
      # OpenSSF Scorecard. The CLI is installed from its verified release
      # because ossf/scorecard-action cannot emit in-toto results yet; the
      # installer goes away once it can.
      # ------------------------------------------------------------------
      - name: Install Scorecard
        uses: carabiner-dev/actions/install/scorecard@27d1414fda764bc92954af611b418e39424df2ca # main

      - name: Run Scorecard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          scorecard \
            --repo="${REPOSITORY}" \
            --commit="${COMMIT}" \
            --format=intoto \
            > scorecard.intoto.json

      - name: Attest Scorecard results
        uses: carabiner-dev/actions/bnd/sign@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          json-path: scorecard.intoto.json
          output: attestations/scorecard.bundle.json

      # ------------------------------------------------------------------
      # Tests (Go modules only, beaker runs go test)
      # ------------------------------------------------------------------
      - name: Attest tests
        if: hashFiles('go.mod') != ''
        uses: carabiner-dev/actions/beaker/tests@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          output: attestations/tests.bundle.json

      # ------------------------------------------------------------------
      # Vulnerabilities: OSV scan results and the VEX document that
      # assesses them
      # ------------------------------------------------------------------
      - name: Scan with OSV
        uses: google/osv-scanner-action/osv-scanner-action@b77c075a1235514558f0eb88dbd31e22c45e0cd2 # v2.3.0
        continue-on-error: true # a non-zero exit means findings, not a failure
        with:
          scan-args: |-
            --output=osv-results.json
            --format=json
            .

      - name: Attest OSV results
        if: hashFiles('osv-results.json') != ''
        uses: carabiner-dev/actions/bnd/sign@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          json-path: osv-results.json
          is-predicate: 'true'
          predicate-type: https://ossf.github.io/osv-schema/results@v1.6.7
          subject: sha1:${{ github.sha }}
          output: attestations/osv-results.bundle.json

      - name: Attest VEX document
        uses: carabiner-dev/actions/vexflow/assemble@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          branch: ${{ env.BRANCH }}
          output: attestations/openvex.bundle.json

      # ------------------------------------------------------------------
      # SLSA source provenance, computed for this commit by another workflow
      # ------------------------------------------------------------------
      - name: Download SLSA source provenance
        id: slsa-source
        if: inputs.slsa-source-workflow != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ inputs.slsa-source-workflow }}
        run: |
          set -euo pipefail

          # Prefer a branch-push run: tag-push runs produce tag provenance
          # that the policy chains cannot resolve.
          run_id="$(gh run list \
            --repo "${REPOSITORY}" \
            --workflow "${WORKFLOW}" \
            --commit "${COMMIT}" \
            --event push \
            --status success \
            --limit 10 \
            --json databaseId,headBranch \
            --jq '[.[] | select(.headBranch | startswith("refs/tags/") | not)] | .[0].databaseId // empty')"

          if [ -z "${run_id}" ]; then
            run_id="$(gh run list \
              --repo "${REPOSITORY}" \
              --workflow "${WORKFLOW}" \
              --commit "${COMMIT}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi

          if [ -z "${run_id}" ]; then
            echo "::notice::No successful '${WORKFLOW}' run found for ${COMMIT}, evaluating without source provenance"
            exit 0
          fi

          gh run download "${run_id}" \
            --repo "${REPOSITORY}" \
            --name prov_metadata \
            --dir slsa-source

          bundle="slsa-source/signed_bundle.intoto.jsonl"
          if [ -s "${bundle}" ]; then
            echo "jsonl=${bundle}" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Run ${run_id} of '${WORKFLOW}' has no signed_bundle.intoto.jsonl, evaluating without source provenance"
          fi

      # ------------------------------------------------------------------
      # Pack everything and evaluate the policy
      # ------------------------------------------------------------------
      - name: Pack attestations
        uses: carabiner-dev/actions/bnd/pack@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          bundles: |
            attestations/
            ${{ steps.slsa-source.outputs.jsonl }}
          output: attestations.jsonl
          upload-artifact: 'true'

      - name: Evaluate compliance
        uses: carabiner-dev/actions/ampel/verify@27d1414fda764bc92954af611b418e39424df2ca # main
        with:
          subject: sha1:${{ github.sha }}
          collector: jsonl:attestations.jsonl
          policy: ${{ inputs.policy }}
          attest: 'true'
          results-path: ampel.intoto.json
          push-attestation: 'true'
          fail: ${{ inputs.fail-on-policy }}

  push:
    name: Push to the GitHub attestations store
    if: inputs.push-attestations
    needs: attest
    runs-on: ubuntu-latest
    # No permissions block on purpose: a called workflow can only narrow the
    # permissions the caller granted, and asking for attestations: write here
    # would fail the whole run for callers that did not grant it, even when
    # this job is skipped. The job inherits the caller's grant instead and
    # checks for attestations: write itself before doing anything.
    env:
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check the token can write attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Probe the attestations endpoint with an empty request. Without
          # attestations: write GitHub refuses the call before looking at
          # the body (403, or 404 when it hides the repository); with it,
          # the empty body is rejected as a bad request.
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{}' \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/attestations")"

          case "${status}" in
            401|403|404)
              echo "::error::The workflow token cannot write to the attestations store of ${REPOSITORY} (HTTP ${status}). Grant 'attestations: write' in the permissions of the job calling this workflow, or set push-attestations to false."
              exit 1
              ;;
            400|422)
              echo "The token can write attestations to ${REPOSITORY}"
              ;;
            *)
              echo "::error::Unexpected HTTP ${status} probing the attestations store of ${REPOSITORY}"
              exit 1
              ;;
          esac

      - name: Download the attestations bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations.jsonl
          path: downloads

      # ampel/verify does not attest the results on workflow_dispatch runs,
      # so the artifact may not exist. A pattern download does not fail
      # when nothing matches, unlike a download by name.
      - name: Download the evaluation results attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ampel.intoto.json
          merge-multiple: 'true'
          path: downloads

      - name: Install bnd
        uses: carabiner-dev/actions/install/bnd@27d1414fda764bc92954af611b418e39424df2ca # main

      - name: Push attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # bnd push takes bundle files, not jsonl, so write each line of
          # the packed file to its own bundle and push the directory.
          mkdir -p bundles
          i=0
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            i=$((i + 1))
            printf '%s\n' "${line}" > "bundles/$(printf '%04d' "${i}").json"
          done < downloads/attestations.jsonl

          if [ "${i}" -eq 0 ]; then
            echo "::error::downloads/attestations.jsonl holds no attestations"
            exit 1
          fi

          paths=(bundles/)
          if [ -s downloads/ampel.intoto.json ]; then
            paths+=(downloads/ampel.intoto.json)
            echo "Pushing ${i} evidence attestation(s) and the evaluation results to ${REPOSITORY}"
          else
            echo "::notice::No evaluation results attestation found, pushing only the ${i} evidence attestation(s) to ${REPOSITORY}"
          fi

          bnd push github "${REPOSITORY}" "${paths[@]}"
